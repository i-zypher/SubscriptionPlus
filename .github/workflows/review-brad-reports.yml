# Every morning: read the past day's reported Brad replies from Cloud
# Logging, have Claude review them, and open an issue with the digest.
# No reports means no issue. Keep this repo private: the digest contains
# Brad's replies, which can quote players.
name: Review Brad reports

on:
  schedule:
    - cron: "7 13 * * *" # about 8am in New York (9am in summer)
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  id-token: write

jobs:
  review:
    # Skips quietly until the one-time Google Cloud setup is done
    if: ${{ vars.GCP_WIF_PROVIDER != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_SERVICE_ACCOUNT }}

      - uses: google-github-actions/setup-gcloud@v2

      - name: Read the past day's reports
        run: >-
          gcloud logging read
          'resource.type="cloud_run_revision" AND resource.labels.service_name="brad" AND jsonPayload.message="Brad reply reported"'
          --project ceymer-studios-site --freshness=1d --limit=500 --format=json
          > reports.json

      - name: Review them
        run: |
          # The same Anthropic key Brad uses, straight from Secret Manager
          KEY="$(gcloud secrets versions access latest --secret=ANTHROPIC_API_KEY --project ceymer-studios-site)"
          echo "::add-mask::$KEY"
          ANTHROPIC_API_KEY="$KEY" node scripts/review-brad-reports.mjs reports.json > digest.md
          echo "Reports found: $(node -e 'console.log(JSON.parse(require("fs").readFileSync("reports.json","utf8")||"[]").length)')"

      - name: Open the digest issue
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ ! -s digest.md ]; then echo "No reports today."; exit 0; fi
          gh label create brad-report --color F2596B --description "Daily review of reported Brad replies" --force
          gh issue create --title "Brad reports: $(date -u +%Y-%m-%d)" --label brad-report --body-file digest.md
